[project]
name = "arbitre-des-trains"
version = "0.1.0"
description = "Répond sur la régularité des TGV et refuse tout chiffre qui n'a pas été calculé par du code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
